<!--
  Plantilla de aviso para ti (opcional) en EmailJS.
  Asunto sugerido:  🟢 Nuevo registro Mindflow: {{nombre}} ({{tipo}})
  To Email:         TU correo
  Reply To:         {{reply_to}}   (así respondes directamente al psicólogo)
-->
<div style="font-family:Arial,Helvetica,sans-serif;font-size:15px;color:#1d2140;max-width:520px;">
  <h2 style="margin:0 0 12px;color:#4f46e5;">Nuevo registro en el acceso anticipado</h2>
  <table cellpadding="6" cellspacing="0" style="border-collapse:collapse;font-size:15px;">
    <tr><td style="color:#5b6180;">Nombre</td><td><b>{{nombre}}</b></td></tr>
    <tr><td style="color:#5b6180;">Email</td><td>{{email}}</td></tr>
    <tr><td style="color:#5b6180;">WhatsApp</td><td>{{whatsapp}}</td></tr>
    <tr><td style="color:#5b6180;">Consulta</td><td>{{tipo}}</td></tr>
    <tr><td style="color:#5b6180;">Plan</td><td>{{plan}}</td></tr>
    <tr><td style="color:#5b6180;">Código</td><td><b>{{codigo}}</b></td></tr>
    <tr><td style="color:#5b6180;">Fecha</td><td>{{fecha}}</td></tr>
  </table>
  <p style="margin-top:16px;color:#5b6180;">Responde a este correo para escribirle directamente. Consejo: contacta en menos de 24 h, cuando el interés está en su punto más alto.</p>
</div>
